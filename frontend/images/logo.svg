<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Blood Drop Icon with Pulse Line -->
  <g transform="translate(10, 6)">
    <!-- Drop Background Glow -->
    <path d="M24 2 C18 12, 6 22, 6 32 A18 18 0 0 0 42 32 C42 22, 30 12, 24 2 Z" fill="#c9182b"/>
    <!-- Drop Inner Highlight -->
    <path d="M24 6 C20 14, 11 22, 11 31 A13 13 0 0 0 24 44 C20 44, 10 37, 10 31 C10 22, 20 14, 24 6 Z" fill="#e53935" opacity="0.6"/>
    <!-- Heartbeat Pulse Line Inside Drop -->
    <path d="M12 32 L18 32 L21 24 L25 38 L28 29 L31 34 L36 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sparkle Accent -->
    <circle cx="34" cy="18" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- LifeLink Typography -->
  <text x="64" y="35" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#111827" letter-spacing="-0.5">
    Life<tspan fill="#c9182b">Link</tspan>
  </text>
  <text x="65" y="48" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#dc2626" letter-spacing="1.5">
    BLOOD DONOR FINDER
  </text>
</svg>
